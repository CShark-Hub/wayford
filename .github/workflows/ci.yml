name: CI

# Runs on every PR and every push to main. No paths filter: a workflow skipped
# by one never reports, and a required check that never reports blocks the PR.
on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR cancels the run on its stale commit. Runs on main always
# finish, so every commit on main gets a result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    # The tests alone took 460 to 552 s on 2026-10-11, so 10 minutes cut runs off
    # with every test passed.
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs, since tags can move or lag behind:
      # pnpm 12 needs pnpm/action-setup v6.1.0, and in 2026-09 its v6 tag was
      # still at v6.0.10.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the version in package.json's packageManager field.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      # The browser tests (`*.browser.test.ts`) launch Chromium through Playwright. The headless
      # shell is what `chromium.launch()` runs headless; `--with-deps` adds its system libraries.
      - name: Install Chromium
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @wayford/filter exec playwright install --with-deps --only-shell chromium

      # Each check runs whenever install succeeded, even after an earlier check
      # failed, so one run reports every failure.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test
